name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint


  # ============================================================
  # BACKEND TESTS
  # ============================================================
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg2

          url = os.environ["DATABASE_URL"]

          for i in range(30):
              try:
                  conn = psycopg2.connect(url)
                  conn.close()
                  print("Postgres ready")
                  break
              except Exception as e:
                  print(f"Waiting for Postgres... attempt {i + 1}/30")
                  print(e)
                  time.sleep(1)
          else:
              raise SystemExit("Postgres did not become ready in time")
          PY

      - name: Run tests
        run: pytest -q


  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  build-and-push:
    name: Build and push Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - test-backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/caminhos-imunizacao-backend:latest
            ghcr.io/${{ github.repository }}/caminhos-imunizacao-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/caminhos-imunizacao-frontend:latest
            ghcr.io/${{ github.repository }}/caminhos-imunizacao-frontend:${{ github.sha }}


  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true

          script: |
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"

            echo "======================================"
            echo "Deploy Caminhos da Imunizacao"
            echo "======================================"

            echo "Checking Docker..."
            docker --version
            docker compose version

            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Starting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for services..."
            sleep 10

            echo "Checking containers..."
            docker compose -f docker-compose.prod.yml ps

            echo "Checking backend health..."
            curl --fail http://localhost:8000/health

            echo "Cleaning unused images..."
            docker image prune -f

            echo "======================================"
            echo "Deploy completed successfully!"
            echo "======================================"